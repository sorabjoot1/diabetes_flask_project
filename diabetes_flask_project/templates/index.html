<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Diabetes Prediction</h1>
            <p class="subtitle">Machine Learning Prediction System</p>

            {% if result %}
            <div class="result {{ result_class }}">
                <h2>{{ result }}</h2>
                <p>{{ message }}</p>
            </div>
            {% endif %}

            {% if error %}
            <div class="result danger">
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form action="/predict" method="POST">

                <div class="grid">
                    <div class="field">
                        <label>Gender</label>
                        <select name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Female">Female</option>
                            <option value="Male">Male</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Age</label>
                        <input type="number" name="age" min="1" max="120" step="0.1"
                            value="{{ form_data.age if form_data else '' }}" required>
                    </div>

                    <div class="field">
                        <label>Hypertension</label>
                        <select name="hypertension" required>
                            <option value="">Select</option>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Heart Disease</label>
                        <select name="heart_disease" required>
                            <option value="">Select</option>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Smoking History</label>
                        <select name="smoking_history" required>
                            <option value="">Select</option>
                            <option value="never">Never</option>
                            <option value="No Info">No Info</option>
                            <option value="current">Current</option>
                            <option value="former">Former</option>
                            <option value="ever">Ever</option>
                            <option value="not current">Not Current</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>BMI</label>
                        <input type="number" name="bmi" min="5" max="100" step="0.01"
                            value="{{ form_data.bmi if form_data else '' }}" required>
                    </div>

                    <div class="field">
                        <label>HbA1c Level</label>
                        <input type="number" name="HbA1c_leve" min="2" max="20" step="0.1"
                            value="{{ form_data.HbA1c_leve if form_data else '' }}" required>
                    </div>

                    <div class="field">
                        <label>Blood Glucose Level</label>
                        <input type="number" name="blood_glucose_levell" min="40" max="500"
                            value="{{ form_data.blood_glucose_levell if form_data else '' }}" required>
                    </div>
                </div>

                <button type="submit">Predict Diabetes</button>
            </form>

            <p class="note">
                This is an educational machine-learning prediction and is not a medical diagnosis.
            </p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
